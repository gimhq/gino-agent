[package]
name = "gino-mini-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "Minimal reference host for gino-agent: enrollment, dispatch and transcripts over the host-agent protocol."
license = "Apache-2.0"
repository = "https://github.com/gimhq/gino-agent"
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tokio-tungstenite = "0.30"

[lints.rust]
unsafe_code = "forbid"
warnings = { level = "deny", priority = -2 }
missing_debug_implementations = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

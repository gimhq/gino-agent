# cargo-deny supply-chain policy for `gino-mini-host`.
#
# Security advisories are denied by default.

[advisories]
yanked = "warn"

[licenses]
# This crate is unpublished (`publish = false`); skip the license check for it.
private = { ignore = true }
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Permissive licenses only. Add a new entry only after a deliberate review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { name = "openssl", reason = "no TLS stack: bind to loopback or put a TLS proxy in front" },
    { name = "openssl-sys", reason = "no TLS stack" },
    { name = "native-tls", reason = "no TLS stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[package]
name = "gino-vmm"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
description = "libkrun microVM launcher for the gino agent's vm isolation mode."
license = "Apache-2.0"
repository = "https://github.com/gimhq/gino"
publish = false

[dependencies]
# prctl in the FFI module.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libkrun compiled in; `net` and `blk` are what upstream `make NET=1 BLK=1` enable.
krun = { package = "libkrun", version = "=1.19.7", git = "https://github.com/containers/libkrun.git", rev = "43b2f5aadeebb90f42053c9df2ec8b16583e554f", features = ["net", "blk"] }
# Builds libkrun's bzip2 dependency from vendored source instead of linking the system libbz2.
bzip2 = { version = "0.5", features = ["static"] }

[package.metadata.cargo-shear]
# Only enables the `static` feature of libkrun's bzip2 dependency.
ignored = ["bzip2"]

[profile.release]
panic = "unwind"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[lints.rust]
# Allowed only in `src/ffi.rs`.
unsafe_code = "deny"
# Deny every warn-by-default lint (current + future toolchains). priority -2 lets
# the clippy groups below (priority -1) and named lints (priority 0) override it.
warnings = { level = "deny", priority = -2 }
missing_debug_implementations = "warn"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# No panics in runtime paths (relaxed in tests via clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "warn"
# Every unsafe block in the FFI module carries a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"
# Pedantic lints with poor signal-to-noise for this crate.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
